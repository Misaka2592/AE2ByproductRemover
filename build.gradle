plugins {
    id 'base'
    id 'net.minecraftforge.gradle' version '6.0.54' apply false
    id 'net.neoforged.moddev' version '2.0.107' apply false
}

subprojects {
    apply plugin: 'java'
    group = 'dev.ae2byproductremover'
    version = rootProject.mod_version

    repositories {
        mavenCentral()
        maven {
            url = 'https://modmaven.dev/'
            content {
                includeGroup 'appeng'
                includeGroup 'org.appliedenergistics'
            }
        }
    }

    sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
    sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')
    sourceSets.test.java.srcDir rootProject.file('common/src/test/java')
    sourceSets.test.resources.srcDir rootProject.file('common/src/test/resources')

    tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
    tasks.withType(ProcessResources).configureEach {
        inputs.property 'mod_version', project.version
        filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
            expand mod_version: project.version
        }
    }
    tasks.withType(Jar).configureEach {
        archiveBaseName = "ae2byproductremover-${project.name}"
    }
    tasks.withType(Test).configureEach { useJUnitPlatform() }
    dependencies {
        testImplementation platform('org.junit:junit-bom:5.11.4')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
}

tasks.named('build') { dependsOn ':forge:build', ':neoforge:build' }
