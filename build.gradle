plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.107'
}

group = 'dev.ae2byproductremover'
version = mod_version

repositories {
    mavenCentral()
    maven {
        url = 'https://modmaven.dev/'
        content {
            includeGroup 'org.appliedenergistics'
        }
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(ProcessResources).configureEach {
    inputs.property 'mod_version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand mod_version: project.version
    }
}
tasks.withType(Jar).configureEach {
    archiveBaseName = 'ae2byproductremover-neoforge'
    archiveClassifier = providers.gradleProperty('build_suffix').orElse('')
    from('LICENSE')
    from('THIRD_PARTY_NOTICES.md')
    from('licenses') { into 'licenses' }
}
tasks.withType(Test).configureEach { useJUnitPlatform() }
dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    smoke {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    smokeImplementation.extendsFrom implementation
    smokeRuntimeOnly.extendsFrom runtimeOnly
}

neoForge {
    version = '21.1.250'
    addModdingDependenciesTo sourceSets.smoke
    mods {
        ae2byproductremover { sourceSet sourceSets.main }
        ae2byproductremoverSmoke {
            sourceSet sourceSets.main
            sourceSet sourceSets.smoke
        }
    }
    runs {
        client {
            client()
            loadedMods = [mods.ae2byproductremover]
        }
        server {
            server()
            programArgument '--nogui'
            loadedMods = [mods.ae2byproductremover]
        }
        clientSmoke {
            client()
            sourceSet = sourceSets.smoke
            gameDirectory = project.layout.buildDirectory.dir('client-smoke')
            systemProperty 'ae2byproductremover.clientSmoke', 'true'
            loadedMods = [mods.ae2byproductremoverSmoke]
        }
    }
    unitTest {
        enable()
        testedMod = mods.ae2byproductremover
        loadedMods = [mods.ae2byproductremover]
    }
}

dependencies {
    implementation 'org.appliedenergistics:appliedenergistics2:19.2.17'
}

repositories {
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

// Addons remain optional at runtime and are never bundled in the released mod.
// Tests can load the exact production jars, including the pack's Thunderbolt build.
def compatModsDir = providers.gradleProperty('compatModsDir')
if (compatModsDir.isPresent()) {
    def addonJar = { String name -> new File(compatModsDir.get(), name) }
    dependencies {
        compileOnly files(addonJar('AdvancedAE-1.6.12-1.21.1.jar'),
                addonJar('neoecoae-21.1.1.jar'))
    }
    if (providers.gradleProperty('compatTests').map { it.toBoolean() }.getOrElse(false)) {
        sourceSets.test.java.srcDir 'src/compatTest/java'
        dependencies {
            testImplementation files(addonJar('AdvancedAE-1.6.12-1.21.1.jar'),
                    addonJar('neoecoae-21.1.1.jar'), addonJar('thunderbolt-1.0.6.jar'),
                    addonJar('data_energistics-1.21.1-3.1.3.jar'),
                    addonJar('ldlib2-neoforge-1.21.1-2.2.37-all.jar'),
                    addonJar('geckolib-neoforge-1.21.1-4.9.2.jar'))
        }
    }
} else {
    dependencies {
        compileOnly 'maven.modrinth:advancedae:ablTMAjP'
        compileOnly 'maven.modrinth:neoecoae:gWMhHBje'
    }
}
